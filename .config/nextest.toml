# Minimal nextest configuration.
#
# test_global_influencers_alltime_cache_recovery deletes and reseeds the shared
# Sorted:Users:Influencers Redis sorted set. nextest runs each test in its own
# process, in parallel, against one shared Redis, so that test must never
# interleave with the sibling tests that assert the exact member order of the
# same sorted set. Put all three in a test group limited to one concurrent test.

[test-groups]
influencers-sorted-set = { max-threads = 1 }
trust-ranking = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(=stream::user::influencers::test_global_influencers) | test(=stream::user::influencers::test_global_influencers_skip_limit) | test(=stream::user::influencers::test_global_influencers_alltime_cache_recovery)'
test-group = 'influencers-sorted-set'

# nexusd/tests/cache_setup/main.rs calls clear_redis(), which issues FLUSHDB
# against the shared Redis instance. It must not overlap with any other test in
# the run, including nexus-webapi's search suite under --workspace, or that
# test sees its keys and FT index vanish mid-flight. A [test-groups] entry
# would not help: group limits only apply between members of the same group,
# so a one-test group protects nothing. threads-required = 'num-test-threads'
# is what gives global exclusivity: nextest waits for every running test to
# finish, runs this binary alone, then resumes the rest.

[[profile.default.overrides]]
filter = 'package(nexusd) and binary(cache_setup)'
threads-required = 'num-test-threads'

# user::views::test_social_graph_status drops and rebuilds the shared trust
# ranking (Sorted:Users:SocialGraph). The hot-tags trust filter is gated on
# that ranking existing, so no test that reads a hot-tags surface may run while
# the key is gone: the two reach tests would see the filter off and get the
# unranked taggers back, and the two global taggers tests would read the
# unranked cache variant, which reindex never warms (db mock builds the ranking
# first) and which the global taggers path never fills on a miss, so they would
# get an empty list. A group (declared above), not exclusivity: only these five
# interact.

[[profile.default.overrides]]
filter = 'test(=user::views::test_social_graph_status) | test(=tags::hot::test_hot_tags_by_reach_hide_unranked_taggers) | test(=tags::hot::test_hot_tags_label_taggers_by_reach_hide_unranked_taggers) | test(=tags::hot::test_hot_tags_label_taggers) | test(=tags::hot::test_hot_tags_label_taggers_with_skip_limit_and_timeframe)'
test-group = 'trust-ranking'
